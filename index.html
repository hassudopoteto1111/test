<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Vercel deployment smoke test page.">
  <title>Vercel Smoke Test</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at top, #263449, #111827 60%); color: #f9fafb; }
    main { width: min(100%, 680px); padding: clamp(24px, 5vw, 48px); border: 1px solid #475569; border-radius: 24px; background: rgb(15 23 42 / 88%); box-shadow: 0 24px 80px rgb(0 0 0 / 28%); }
    .pill { display: inline-flex; gap: 8px; align-items: center; border: 1px solid #365f4a; border-radius: 999px; padding: 7px 12px; color: #bbf7d0; background: #123322; font-size: 14px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
    h1 { margin: 24px 0 12px; font-size: clamp(2rem, 7vw, 3.5rem); letter-spacing: -.04em; line-height: 1.05; }
    p { color: #cbd5e1; line-height: 1.7; }
    .details { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 28px; }
    .detail { border: 1px solid #334155; border-radius: 14px; padding: 16px; }
    .label { color: #94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    .value { margin-top: 8px; font-weight: 600; overflow-wrap: anywhere; }
    button { margin-top: 24px; border: 0; border-radius: 12px; padding: 12px 16px; color: #0f172a; background: #e2e8f0; font: inherit; font-weight: 650; cursor: pointer; }
    button:focus-visible { outline: 3px solid #60a5fa; outline-offset: 3px; }
    footer { margin-top: 24px; color: #94a3b8; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <span class="pill"><span class="dot" aria-hidden="true"></span> Static page is running</span>
    <h1>Vercel deploy<br>smoke test</h1>
    <p>このページが表示されていれば、GitHub から配信された静的サイトが正常に動作しています。フレームワークやビルド手順は不要な最小構成です。</p>
    <section class="details" aria-label="Deployment details">
      <div class="detail"><div class="label">Status</div><div class="value" id="status">OK</div></div>
      <div class="detail"><div class="label">Runtime</div><div class="value">Static HTML</div></div>
      <div class="detail"><div class="label">Checked at</div><div class="value" id="checked-at">Loading…</div></div>
    </section>
    <button id="check-button" type="button">動作を再確認</button>
    <footer>Vercel Smoke Test · No secrets or external dependencies</footer>
  </main>
  <script>
    const checkedAt = document.querySelector("#checked-at");
    const status = document.querySelector("#status");
    function checkPage() {
      checkedAt.textContent = new Date().toLocaleString("ja-JP");
      status.textContent = document.querySelector("h1") ? "OK" : "ERROR";
    }
    document.querySelector("#check-button").addEventListener("click", checkPage);
    checkPage();
  </script>
</body>
</html>
